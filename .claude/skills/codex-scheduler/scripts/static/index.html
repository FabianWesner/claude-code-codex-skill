<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>codex-scheduler</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 20px;
         background: #0e1116; color: #d8dee4; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 14px; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 10px; color: #8b949e; font-weight: 500; border-bottom: 1px solid #21262d; }
  td { padding: 6px 10px; border-bottom: 1px solid #161b22; vertical-align: top; }
  tr.job-row { cursor: pointer; }
  tr.job-row:hover { background: #161b22; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .queued { background: #30363d; color: #c9d1d9; }
  .running { background: #1f6feb33; color: #58a6ff; }
  .done { background: #23863633; color: #3fb950; }
  .failed { background: #da363333; color: #f85149; }
  .stopped { background: #6e768133; color: #8b949e; }
  .slug { font-family: ui-monospace, monospace; }
  .deps { color: #8b949e; font-size: 11px; }
  .detail { display: none; background: #0d1117; }
  .detail.open { display: table-row; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; height: 340px;
        overflow-y: auto; background: #010409; padding: 10px; border-radius: 6px; margin: 6px 0 0;
        box-sizing: border-box; }
  .meta { font-size: 12px; color: #8b949e; margin-top: 6px; }
  .updated { color: #8b949e; white-space: nowrap; }
  .detail-grid { display: flex; gap: 12px; align-items: flex-start; }
  .detail-box { flex: 1; min-width: 0; }
  .detail-box h4 { margin: 10px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
                   color: #8b949e; font-weight: 600; }
  .steer-list { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
  .steer-list li { margin-bottom: 4px; }
  .steer-list .none { list-style: none; margin-left: -18px; color: #8b949e; }
</style>
</head>
<body>
<h1>codex-scheduler</h1>
<table>
  <thead>
    <tr><th>ID</th><th>Slug</th><th>Status</th><th>Updated</th><th>Model</th><th>Effort</th><th>Fast</th><th>Session</th><th>Workspace</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
const rowsEl = document.getElementById('rows');
const openSlugs = new Set();
const logOffsets = {};
const logText = {};
const LOG_TAIL_LINES = 100;

function esc(s) { return (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function timeAgo(iso) {
  if (!iso) return '-';
  const then = new Date(iso.endsWith('Z') ? iso : iso + 'Z').getTime();
  if (isNaN(then)) return iso;
  const secs = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (secs < 5) return 'just now';
  if (secs < 60) return `${secs}s ago`;
  const mins = Math.round(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}

function isNearBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 24;
}

async function refresh() {
  const jobs = await fetch('/api/jobs').then(r => r.json());
  jobs.sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));

  // rebuilding the table wipes DOM nodes (and their scrollTop) every tick -- save scroll
  // positions (page + any open prompt/output boxes) first, restore after rebuilding.
  const pageScroll = window.scrollY;
  const scrollState = {};
  for (const slug of openSlugs) {
    const p = document.getElementById('prompt-' + slug);
    const o = document.getElementById('log-' + slug);
    scrollState[slug] = {
      prompt: p ? p.scrollTop : 0,
      output: o ? o.scrollTop : 0,
      outputFollow: o ? isNearBottom(o) : true,
    };
  }

  rowsEl.innerHTML = '';
  for (const j of jobs) {
    const tr = document.createElement('tr');
    tr.className = 'job-row';
    const deps = (j.deps || []).map(d => `${d.slug}(${d.status})`).join(', ');
    tr.innerHTML = `
      <td>${j.id}</td>
      <td class="slug">${esc(j.slug)}${deps ? `<div class="deps">deps: ${esc(deps)}</div>` : ''}</td>
      <td><span class="badge ${j.status}">${j.status}</span></td>
      <td class="updated" title="${esc(j.updated_at)}">${esc(timeAgo(j.updated_at))}</td>
      <td>${esc(j.model)}</td>
      <td>${esc(j.effort)}</td>
      <td>${j.fast_mode ? 'yes' : ''}</td>
      <td>${esc((j.claude_session_id || '').slice(0, 8))}</td>
      <td>${esc(j.workspace)}</td>`;
    tr.onclick = () => toggle(j.slug);
    rowsEl.appendChild(tr);

    const detail = document.createElement('tr');
    detail.className = 'detail' + (openSlugs.has(j.slug) ? ' open' : '');
    detail.id = 'detail-' + j.slug;
    const steers = j.steers || [];
    const steerHtml = steers.length
      ? `<ol class="steer-list">${steers.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`
      : `<div class="steer-list"><span class="none">(none)</span></div>`;
    detail.innerHTML = `<td colspan="9">
      <div class="meta">created ${esc(j.created_at)} · started ${esc(j.started_at || '-')} · finished ${esc(j.finished_at || '-')}</div>
      ${j.error ? `<div class="meta" style="color:#f85149">error: ${esc(j.error)}</div>` : ''}
      <div class="detail-grid">
        <div class="detail-box">
          <h4>Prompt</h4>
          <pre id="prompt-${j.slug}">${esc(j.prompt)}</pre>
          <h4>Steering</h4>
          ${steerHtml}
        </div>
        <div class="detail-box">
          <h4>Output (live, last ${LOG_TAIL_LINES} lines)</h4>
          <pre id="log-${j.slug}"></pre>
        </div>
      </div>
    </td>`;
    rowsEl.appendChild(detail);
    if (openSlugs.has(j.slug)) {
      const state = scrollState[j.slug];
      const promptEl = document.getElementById('prompt-' + j.slug);
      const outputEl = document.getElementById('log-' + j.slug);
      if (promptEl && state) promptEl.scrollTop = state.prompt;
      if (outputEl && logText[j.slug]) outputEl.textContent = tailLines(logText[j.slug]);
      if (outputEl && state) outputEl.scrollTop = state.outputFollow ? outputEl.scrollHeight : state.output;
      pollLog(j.slug);
    }
  }
  window.scrollTo(0, pageScroll);
}

function tailLines(text) {
  return text.split('\n').slice(-LOG_TAIL_LINES).join('\n');
}

function toggle(slug) {
  const el = document.getElementById('detail-' + slug);
  if (!el) return;
  if (openSlugs.has(slug)) { openSlugs.delete(slug); el.classList.remove('open'); }
  else {
    openSlugs.add(slug); el.classList.add('open');
    logOffsets[slug] = 0; logText[slug] = '';
    pollLog(slug);
  }
}

async function pollLog(slug) {
  if (!openSlugs.has(slug)) return;
  const offset = logOffsets[slug] || 0;
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(slug)}/log?offset=${offset}`).then(r => r.json());
    logOffsets[slug] = r.offset;
    if (r.text) {
      logText[slug] = (logText[slug] || '') + r.text;
      const pre = document.getElementById('log-' + slug);
      if (pre) {
        const follow = isNearBottom(pre);
        pre.textContent = tailLines(logText[slug]);
        if (follow) pre.scrollTop = pre.scrollHeight;
      }
    }
  } catch (e) {}
}

setInterval(refresh, 1500);
setInterval(() => { for (const s of openSlugs) pollLog(s); }, 1500);
refresh();
</script>
</body>
</html>
