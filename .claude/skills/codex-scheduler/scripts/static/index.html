<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>codex-scheduler</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 20px;
         background: #0e1116; color: #d8dee4; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 14px; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 10px; color: #8b949e; font-weight: 500; border-bottom: 1px solid #21262d; }
  td { padding: 6px 10px; border-bottom: 1px solid #161b22; vertical-align: top; }
  tr.job-row { cursor: pointer; }
  tr.job-row:hover { background: #161b22; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge[title] { cursor: help; }
  .cancel-btn { background: transparent; border: none; color: #8b949e; cursor: pointer;
                padding: 3px; border-radius: 4px; display: inline-flex; }
  .cancel-btn:hover { color: #f85149; background: #f8514922; }
  .queued { background: #30363d; color: #c9d1d9; }
  .running { background: #1f6feb33; color: #58a6ff; }
  .done { background: #23863633; color: #3fb950; }
  .failed { background: #da363333; color: #f85149; }
  .stopped { background: #6e768133; color: #8b949e; }
  .slug { font-family: ui-monospace, monospace; }
  .deps { color: #8b949e; font-size: 11px; }
  .detail { display: none; background: #0d1117; }
  .detail.open { display: table-row; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; height: 340px;
        overflow-y: auto; background: #010409; padding: 10px; border-radius: 6px; margin: 6px 0 0;
        box-sizing: border-box; }
  .meta { font-size: 12px; color: #8b949e; margin-top: 6px; }
  .updated { color: #8b949e; white-space: nowrap; }
  .working-on { color: #c9d1d9; min-width: 220px; max-width: 260px; }
  .working-on .none { color: #8b949e; font-style: italic; }
  .detail-grid { display: flex; gap: 12px; align-items: flex-start; }
  .detail-box { flex: 1; min-width: 0; }
  .detail-box h4 { margin: 10px 0 0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
                   color: #8b949e; font-weight: 600; }
  .steer-list { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
  .steer-list li { margin-bottom: 4px; }
  .steer-list .none { list-style: none; margin-left: -18px; color: #8b949e; }
</style>
</head>
<body>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
  <h1 style="margin:0;">codex-scheduler</h1>
  <label style="font-size:12px;color:#8b949e;">
    Show finished jobs from:
    <select id="timeWindow" style="margin-left:6px;background:#161b22;color:#d8dee4;border:1px solid #30363d;
                                    border-radius:6px;padding:3px 6px;font-size:12px;">
      <option value="15">last 15 min</option>
      <option value="60" selected>last 60 min</option>
      <option value="480">last 8 hours</option>
      <option value="1440">last 24 hours</option>
      <option value="0">all</option>
    </select>
  </label>
</div>
<table>
  <thead>
    <tr><th>ID</th><th>Slug</th><th>Status</th><th>Working On</th><th>Runtime</th><th>Updated</th><th>Model</th><th>Effort</th><th>Workspace</th><th></th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script>
const rowsEl = document.getElementById('rows');
const openSlugs = new Set();
const logOffsets = {};
const logText = {};
const showFullLog = new Set();
const LOG_TAIL_LINES = 1000;
const SHOWN_ITEM_TYPES = new Set(['agentMessage', 'commandExecution']);

// progress.log is a flat stream: a "[item TYPE] desc" marker line, then raw streamed text
// belonging to that item until the next "[...]" marker line. Filter by grouping continuation
// lines with the marker that introduced them.
function filterLog(text) {
  const itemRe = /^\[item (\w+)\]/;
  const markerRe = /^\[/;
  let currentType = null; // null = always-shown context (not inside a filterable item block)
  const out = [];
  for (const line of text.split('\n')) {
    const im = line.match(itemRe);
    if (im) {
      currentType = im[1];
      if (SHOWN_ITEM_TYPES.has(currentType)) out.push(line);
      continue;
    }
    if (markerRe.test(line)) {
      currentType = null;
      out.push(line);
      continue;
    }
    if (currentType === null || SHOWN_ITEM_TYPES.has(currentType)) out.push(line);
  }
  return out.join('\n');
}

function computeDisplayText(slug) {
  const full = logText[slug] || '';
  return tailLines(showFullLog.has(slug) ? full : filterLog(full));
}

function toggleFull(slug) {
  if (showFullLog.has(slug)) showFullLog.delete(slug); else showFullLog.add(slug);
  const pre = document.getElementById('log-' + slug);
  if (pre) { pre.textContent = computeDisplayText(slug); pre.scrollTop = pre.scrollHeight; }
}

async function cancelJob(slug, ev) {
  ev.stopPropagation();
  if (!confirm(`Cancel job "${slug}"? The Claude session that submitted it will be told you did this.`)) return;
  try {
    await fetch(`/api/jobs/${encodeURIComponent(slug)}/stop`, { method: 'POST' });
  } catch (e) {}
  refresh();
}

function esc(s) { return (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function timeAgo(iso) {
  if (!iso) return '-';
  const then = new Date(iso.endsWith('Z') ? iso : iso + 'Z').getTime();
  if (isNaN(then)) return iso;
  const secs = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (secs < 5) return 'just now';
  if (secs < 60) return `${secs}s ago`;
  const mins = Math.round(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.round(hrs / 24)}d ago`;
}

function toEpoch(iso) {
  if (!iso) return NaN;
  return new Date(iso.endsWith('Z') ? iso : iso + 'Z').getTime();
}

function formatDuration(secs) {
  secs = Math.max(0, Math.round(secs));
  if (secs < 60) return `${secs}s`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins / 60);
  return `${hrs}h${mins % 60}m`;
}

function runtimeFor(j) {
  if (!j.started_at) return '-';
  const start = toEpoch(j.started_at);
  if (isNaN(start)) return '-';
  const end = j.status === 'running' ? Date.now() : toEpoch(j.finished_at) || Date.now();
  return formatDuration((end - start) / 1000);
}

function shortWorkspace(path) {
  const parts = (path || '').split('/').filter(Boolean);
  return parts.slice(-2).join('/') || path;
}

const TRASH_ICON = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">' +
  '<path d="M6 1.5a.5.5 0 0 0-.5.5v1H2.5a.5.5 0 0 0 0 1H3v9.5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 ' +
  '1.5-1.5V4h.5a.5.5 0 0 0 0-1H10V2a.5.5 0 0 0-.5-.5h-3.5zm.5 2V3h3v.5h-3zM4.5 4h7v9.5a.5.5 0 0 1-.5.5h' +
  '-6a.5.5 0 0 1-.5-.5V4zm2 2a.5.5 0 0 0-.5.5v6a.5.5 0 0 0 1 0v-6a.5.5 0 0 0-.5-.5zm3 0a.5.5 0 0 0-.5.5v' +
  '6a.5.5 0 0 0 1 0v-6a.5.5 0 0 0-.5-.5z"/></svg>';

function woHistoryTooltip(j) {
  const hist = j.working_on_history || [];
  if (!hist.length) return '';
  return hist.map(h => {
    const t = (h.created_at || '').split('T')[1]?.split('.')[0] || '';
    return `[${t}] ${h.text}`;
  }).join('\n');
}

function isNearBottom(el) {
  return el.scrollHeight - el.scrollTop - el.clientHeight < 24;
}

const TERMINAL_STATUSES = new Set(['done', 'failed', 'stopped']);
const timeWindowEl = document.getElementById('timeWindow');
try {
  const saved = localStorage.getItem('codex-scheduler-time-window');
  if (saved) timeWindowEl.value = saved;
} catch (e) {}
timeWindowEl.onchange = () => {
  try { localStorage.setItem('codex-scheduler-time-window', timeWindowEl.value); } catch (e) {}
  refresh();
};

function withinTimeWindow(j) {
  const minutes = parseInt(timeWindowEl.value, 10);
  if (!minutes || !TERMINAL_STATUSES.has(j.status)) return true; // 0 = "all"; non-terminal always shown
  const then = new Date((j.updated_at || '').endsWith('Z') ? j.updated_at : j.updated_at + 'Z').getTime();
  if (isNaN(then)) return true;
  return (Date.now() - then) / 60000 <= minutes;
}

async function refresh() {
  let jobs = await fetch('/api/jobs').then(r => r.json());
  jobs = jobs.filter(withinTimeWindow);
  jobs.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));

  // rebuilding the table wipes DOM nodes (and their scrollTop) every tick -- save scroll
  // positions (page + any open prompt/output boxes) first, restore after rebuilding.
  const pageScroll = window.scrollY;
  const scrollState = {};
  for (const slug of openSlugs) {
    const p = document.getElementById('prompt-' + slug);
    const o = document.getElementById('log-' + slug);
    scrollState[slug] = {
      prompt: p ? p.scrollTop : 0,
      output: o ? o.scrollTop : 0,
      outputFollow: o ? isNearBottom(o) : true,
    };
  }

  rowsEl.innerHTML = '';
  for (const j of jobs) {
    const tr = document.createElement('tr');
    tr.className = 'job-row';
    const deps = (j.deps || []).map(d => `${d.slug}(${d.status})`).join(', ');
    tr.innerHTML = `
      <td>${j.id}</td>
      <td class="slug">${esc(j.slug)}${deps ? `<div class="deps">deps: ${esc(deps)}</div>` : ''}</td>
      <td><span class="badge ${j.status}"${j.error ? ` title="${esc(j.error)}"` : ''}>${j.status}</span></td>
      <td class="working-on"${woHistoryTooltip(j) ? ` title="${esc(woHistoryTooltip(j))}"` : ''}>${j.status === 'running' ? (j.working_on ? esc(j.working_on) : '<span class="none">starting…</span>') : ''}</td>
      <td class="updated">${esc(runtimeFor(j))}</td>
      <td class="updated" title="${esc(j.updated_at)}">${esc(timeAgo(j.updated_at))}</td>
      <td>${esc(j.model)}</td>
      <td>${esc(j.effort)}${j.fast_mode ? '/fast' : ''}</td>
      <td title="${esc(j.workspace)}">${esc(shortWorkspace(j.workspace))}</td>
      <td>${j.status === 'running' ? `<button class="cancel-btn" title="Cancel this job" onclick="cancelJob('${j.slug}', event)">${TRASH_ICON}</button>` : ''}</td>`;
    tr.onclick = () => toggle(j.slug);
    rowsEl.appendChild(tr);

    const detail = document.createElement('tr');
    detail.className = 'detail' + (openSlugs.has(j.slug) ? ' open' : '');
    detail.id = 'detail-' + j.slug;
    const steers = j.steers || [];
    const steerHtml = steers.length
      ? `<ol class="steer-list">${steers.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`
      : `<div class="steer-list"><span class="none">(none)</span></div>`;
    detail.innerHTML = `<td colspan="10">
      <div class="meta">created ${esc(j.created_at)} · started ${esc(j.started_at || '-')} · finished ${esc(j.finished_at || '-')}</div>
      ${j.error ? `<div class="meta" style="color:#f85149">error: ${esc(j.error)}</div>` : ''}
      <div class="detail-grid">
        <div class="detail-box">
          <h4>Prompt</h4>
          <pre id="prompt-${j.slug}">${esc(j.prompt)}</pre>
          <h4>Steering</h4>
          ${steerHtml}
        </div>
        <div class="detail-box">
          <h4 style="display:flex;justify-content:space-between;align-items:center;">
            <span>Output (live, last ${LOG_TAIL_LINES} lines)</span>
            <label style="font-weight:normal;text-transform:none;letter-spacing:normal;cursor:pointer;">
              <input type="checkbox" onchange="toggleFull('${j.slug}')" ${showFullLog.has(j.slug) ? 'checked' : ''}>
              show all (incl. reasoning / tool calls)
            </label>
          </h4>
          <pre id="log-${j.slug}"></pre>
        </div>
      </div>
    </td>`;
    rowsEl.appendChild(detail);
    if (openSlugs.has(j.slug)) {
      const state = scrollState[j.slug];
      const promptEl = document.getElementById('prompt-' + j.slug);
      const outputEl = document.getElementById('log-' + j.slug);
      if (promptEl && state) promptEl.scrollTop = state.prompt;
      if (outputEl && logText[j.slug] !== undefined) outputEl.textContent = computeDisplayText(j.slug);
      if (outputEl && state) outputEl.scrollTop = state.outputFollow ? outputEl.scrollHeight : state.output;
      pollLog(j.slug);
    }
  }
  window.scrollTo(0, pageScroll);
}

function tailLines(text) {
  return text.split('\n').slice(-LOG_TAIL_LINES).join('\n');
}

function toggle(slug) {
  const el = document.getElementById('detail-' + slug);
  if (!el) return;
  if (openSlugs.has(slug)) { openSlugs.delete(slug); el.classList.remove('open'); }
  else {
    openSlugs.add(slug); el.classList.add('open');
    logOffsets[slug] = 0; logText[slug] = '';
    pollLog(slug);
  }
}

async function pollLog(slug) {
  if (!openSlugs.has(slug)) return;
  const offset = logOffsets[slug] || 0;
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(slug)}/log?offset=${offset}`).then(r => r.json());
    logOffsets[slug] = r.offset;
    if (r.text) {
      logText[slug] = (logText[slug] || '') + r.text;
      const pre = document.getElementById('log-' + slug);
      if (pre) {
        const follow = isNearBottom(pre);
        pre.textContent = computeDisplayText(slug);
        if (follow) pre.scrollTop = pre.scrollHeight;
      }
    }
  } catch (e) {}
}

setInterval(refresh, 1500);
setInterval(() => { for (const s of openSlugs) pollLog(s); }, 1500);
refresh();
</script>
</body>
</html>
